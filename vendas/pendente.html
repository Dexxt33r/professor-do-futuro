<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento pendente — Professor do Futuro</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <div class="ambient-mesh">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <div class="status-page">
    <div class="status-container">
      <div class="status-card">
        <span class="status-ic">⏳</span>
        <h1>Pagamento em processamento</h1>
        <p>Seu pagamento ainda está sendo analisado. Assim que for confirmado, você receberá um e-mail com o acesso ao curso.</p>
        <div class="status-actions">
          <a href="#" class="btn btn-glass-primary btn-lg">Voltar ao início</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/js/glass-interactions.js"></script>
</body>
</html>
