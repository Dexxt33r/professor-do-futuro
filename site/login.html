<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Professor do Futuro</title>
  <meta name="description" content="Acesse sua conta no curso Professor do Futuro: matérias, prompts e biblioteca de slides.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page{ display:flex; flex-direction:column; min-height:100vh; }
    .auth-wrap{ flex:1; display:grid; place-items:center; padding:3.5rem 1rem 4rem; position:relative; }
    .auth-card{
      width:min(460px,100%);
      background:var(--glass-bg-strong); backdrop-filter:blur(var(--glass-blur)) saturate(150%);
      -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
      border:1px solid var(--glass-border); border-radius:24px;
      box-shadow:0 30px 70px rgba(6,43,27,.18), inset 0 1px 0 rgba(255,255,255,.6);
      padding:2.4rem 2rem;
    }
    .auth-head{ text-align:center; margin-bottom:1.8rem; }
    .auth-icon{
      width:64px; height:64px; margin:0 auto 1rem; border-radius:18px; display:grid; place-items:center;
      font-size:1.9rem; background:linear-gradient(135deg,#0b7a5e,#c9971c);
      box-shadow:0 12px 28px rgba(201,151,28,.35);
    }
    .auth-head h1{ font-size:1.6rem; color:var(--heading); }
    .auth-head p{ color:var(--text-muted); font-size:.95rem; margin-top:.4rem; }
    .auth-flash{
      display:none; padding:.8rem 1rem; border-radius:12px; font-size:.9rem; margin-bottom:1rem;
      border:1px solid; line-height:1.5;
    }
    .auth-flash.err{ display:block; background:rgba(220,38,38,.08); border-color:rgba(220,38,38,.3); color:#b91c1c; }
    .auth-flash.ok{ display:block; background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.35); color:#047857; }
    .auth-flash.info{ display:block; background:rgba(201,151,28,.12); border-color:rgba(201,151,28,.4); color:#96690a; }
    html[data-theme="dark"] .auth-flash.err{ color:#fca5a5; }
    html[data-theme="dark"] .auth-flash.ok{ color:#6ee7b7; }
    html[data-theme="dark"] .auth-flash.info{ color:#f7d98c; }
    .field{ margin-bottom:1.1rem; }
    .field label{ display:block; font-size:.82rem; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--text-muted); margin-bottom:.4rem; }
    .field input{
      width:100%; padding:.85rem 1.05rem; border-radius:12px; border:1px solid var(--glass-border);
      background:var(--glass-bg); font-family:inherit; font-size:1rem; color:var(--body); transition:.2s;
    }
    .field input:focus{ outline:none; border-color:var(--violet-600); background:var(--glass-bg-strong); }
    .auth-row{ display:flex; align-items:center; justify-content:space-between; margin:.4rem 0 1.2rem; font-size:.88rem; }
    .auth-links{ text-align:center; margin-top:1.4rem; font-size:.92rem; color:var(--text-muted); }
    .auth-links a{ color:var(--violet-600); font-weight:700; }
    html[data-theme="dark"] .auth-links a{ color:#f7d98c; }
    .btn-block{ width:100%; }
    .auth-msg{ text-align:center; font-size:.82rem; color:var(--text-muted); margin-top:1rem; }
  </style>
</head>
<body class="auth-page">

  <header class="nav" id="siteNav"></header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-icon">🔐</div>
        <h1>Bem-vindo de volta</h1>
        <p>Entre para acessar seus materiais do curso</p>
      </div>

      <div id="authFlash" class="auth-flash"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary btn-block" type="submit" style="margin-top:.6rem">Entrar</button>
      </form>

      <div class="auth-links">
        Não possui acesso? <a href="register.html">Solicite sua conta ao professor</a>
      </div>
      <p class="auth-msg">O acesso é pessoal e intransferível.</p>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function(){
      var form = document.getElementById('loginForm');
      var flash = document.getElementById('authFlash');
      var btn = form.querySelector('button[type=submit]');

      function show(msg, type){
        flash.textContent = msg;
        flash.className = 'auth-flash ' + (type||'err');
      }

      // se já existe sessão, remove e mostra a tela de login limpa
      Auth.getSession().then(function(session){
        if(session){
          // mantém logado e segue para a página de destino ou index
          var next = new URLSearchParams(location.search).get('next');
          if(next && /^[a-z0-9\-_]+\.html$/i.test(next)){ window.location.replace(next); return; }
          window.location.replace('index.html');
        }
      });

      form.addEventListener('submit', function(e){
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var pass  = document.getElementById('password').value;
        if(!email){ show('Informe seu e-mail.'); return; }
        if(!pass){ show('Informe sua senha.'); return; }

        if(!Auth.configured()){
          show('O login ainda não foi configurado. Contate o administrador.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Entrando...';
        Auth.login(email, pass).then(function(res){
          if(res.ok){
            show('Login realizado! Redirecionando...', 'ok');
            var next = new URLSearchParams(location.search).get('next');
            setTimeout(function(){
              if(next && /^[a-z0-9\-_]+\.html$/i.test(next)) window.location.replace(next);
              else window.location.replace('index.html');
            }, 700);
          } else {
            btn.disabled = false;
            btn.textContent = 'Entrar';
            show(res.error);
          }
        });
      });

      // aguarda o SDK do supabase carregar para liberar o botão
      Auth.ready(function(){
        if(!Auth.configured()){
          show('Atenção: o login ainda não foi configurado (supabase.js).', 'info');
        } else {
          flash.className = 'auth-flash';
          flash.textContent = '';
        }
      });
    })();
  </script>
</body>
</html>
