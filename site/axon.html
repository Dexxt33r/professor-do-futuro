<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXON..</title>
  <meta name="description" content="AXON is a motion research studio: an open logbook of real-time rendering studies in particles, fluids and signed surfaces.">
</head>
<body>
  <canvas id="bg"></canvas>
  <h1 style="color:#fff;position:fixed;top:24px;left:24px;z-index:1;font-family:monospace;">AXON</h1>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script>
    const canvas=document.getElementById('bg');
    const renderer=new THREE.WebGLRenderer({canvas,alpha:false});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setClearColor(0x000000,1);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(30,window.innerWidth/window.innerHeight,0.1,1000);
    camera.position.set(-1.17,0,6);
    const g=new THREE.Group(); g.position.set(0.343,0.16,-1); g.rotation.set(-0.496,6.807,0.086); g.scale.set(5,5,6); scene.add(g);
    const geo=new THREE.BufferGeometry();
    const N=65536;
    const pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){ pos[i*3]=(Math.random()*2-1); pos[i*3+1]=(Math.random()*2-1); pos[i*3+2]=(Math.random()*2-1); }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({color:0xffffff,size:0.02,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false});
    const points=new THREE.Points(geo,mat); g.add(points);
    const mouse={x:window.innerWidth/2,y:window.innerHeight/2};
    window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
    function animate(){ requestAnimationFrame(animate); const tx=-1.17+(mouse.x/window.innerWidth*2-1)*-1; const ty=(mouse.y/window.innerHeight*2-1)*2; camera.position.x+=(tx-camera.position.x)*0.05; camera.position.y+=(ty-camera.position.y)*0.05; camera.lookAt(0,0,0); renderer.render(scene,camera); }
    animate();
    window.addEventListener('resize',()=>{ renderer.setSize(window.innerWidth,window.innerHeight); camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); });
  </script>
</body>
</html>
